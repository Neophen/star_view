name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: '1.17.3'
            otp: '27.1.2'
          - elixir: '1.20.4'
            otp: '29.0.6'
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}
      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: with-phoenix-generator-${{ runner.os }}-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('mix.lock') }}
      # Igniter conditionally compiles generator support when its dependencies build.
      - run: mix archive.install hex phx_new 1.8.15 --force
      - run: mix deps.get --check-locked
      - run: mix compile --warnings-as-errors
        env:
          MIX_ENV: test
      - run: mix test
      - run: mix format --check-formatted
      - run: mix docs --warnings-as-errors
